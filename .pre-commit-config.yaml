repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: no-commit-to-branch
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: pragma-once
        name: require pragma once in headers
        language: system
        files: \.(h|hh|hpp|hxx)$
        entry: bash -c 'missing=$(grep -L "^#pragma once" "$@"); if [ -n "$missing" ]; then echo "$missing"; exit 1; fi' --
      - id: lychee-version-sync
        name: keep lychee LYCHEE_VERSION arg in sync with rev
        language: system
        files: \.pre-commit-config\.yaml$
        entry: bash -c 'f="$1"; rev_ver=$(grep -oE "rev:[ ]lychee-v[0-9]+\.[0-9]+\.[0-9]+" "$f" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+"); args_ver=$(grep -oE "LYCHEE_VERSION=[0-9]+\.[0-9]+\.[0-9]+" "$f" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+"); if [ -z "$rev_ver" ]; then echo "lychee rev not found in $f"; exit 1; fi; if [ -z "$args_ver" ] || [ "$rev_ver" != "$args_ver" ]; then echo "lychee version mismatch in $f -- rev is lychee-v$rev_ver but args LYCHEE_VERSION is ${args_ver:-MISSING}, update both the rev and LYCHEE_VERSION lines together"; exit 1; fi' --

  - repo: https://github.com/lycheeverse/lychee.git
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        files: \.md$
        # LYCHEE_VERSION must match `rev` above -- kept explicit because git worktrees break the hook's own version auto-detection (git-describe sees GIT_DIR pointed at this repo, not its clone) and fail commits with exit 100.
        args: [LYCHEE_VERSION=0.24.2, --no-progress, --include-fragments, --cache, --max-cache-age, 1d]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$

  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.5.1.1
    hooks:
      - id: buildifier
      - id: buildifier-lint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
