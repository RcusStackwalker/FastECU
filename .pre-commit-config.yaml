default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: builtin
    hooks:
      # Fuzz seeds are exact bytes; the text fixers below would change them. So are
      # patches: a blank context line is a single space.
      - id: trailing-whitespace
        exclude: (^|/)testdata/fuzz/|^bazel/patches/.*[.]patch$
      - id: end-of-file-fixer
        exclude: (^|/)testdata/fuzz/|^bazel/patches/.*[.]patch$
      - id: fix-byte-order-marker
        exclude: (^|/)testdata/fuzz/
      - id: no-commit-to-branch
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: (^|/)testdata/fuzz/
  - repo: local
    hooks:
      - id: lizard
        name: C/C++ cyclomatic complexity
        language: python
        additional_dependencies: &lizard_dependencies
          [lizard==1.24.1, pathspec==1.1.1, pygments==2.21.0]
        entry: lizard
        pass_filenames: false
        always_run: true
        # Lizard accepts integer limits only; leave non-CCN metrics effectively unbounded.
        args:
          - --languages=cpp
          - --CCN=15
          - --length=1000000000
          - --arguments=1000000000
          - --Threshold=nloc=1000000000
          - --warnings_only
          - --exclude=*/third_party/*
          - --exclude=*/vendor/*
          - --exclude=*/generated/*
          # Start at the root so Lizard loads .gitignore (including Qt-generated files).
          - .
      # The NLOC metric of the Sonar dedup loop (docs/tooling.md#sonar-dedup-loop):
      # the same scan as `lizard`, reporting every file. Run by scripts/dedup_loop.py.
      - id: nloc
        name: C/C++ NLOC report
        language: python
        additional_dependencies: *lizard_dependencies
        entry: lizard
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [manual]
        # Unbounded limits keep the report free of warnings and the exit status 0.
        args:
          - --languages=cpp
          - --CCN=1000000000
          - --length=1000000000
          - --arguments=1000000000
          - --exclude=*/third_party/*
          - --exclude=*/vendor/*
          - --exclude=*/generated/*
          - .
      # Function line ranges for keying Sonar duplication groups; run by
      # scripts/dedup_loop.py candidates.
      - id: nloc-functions
        name: C/C++ function ranges
        language: python
        additional_dependencies: *lizard_dependencies
        entry: lizard
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [manual]
        args:
          - --languages=cpp
          - --csv
          - --exclude=*/third_party/*
          - --exclude=*/vendor/*
          - --exclude=*/generated/*
          - .
      - id: pragma-once
        name: require pragma once in headers
        language: system
        files: \.(h|hh|hpp|hxx)$
        entry: bash -c 'missing=$(grep -L "^#pragma once" "$@"); if [ -n "$missing" ]; then echo "$missing"; exit 1; fi' --
      - id: no-using-namespace-in-headers
        name: reject using namespace in headers
        language: system
        files: \.(h|hh|hpp|hxx)$
        entry: bash -c 'hits=$(grep -n "^[[:space:]]*using namespace" "$@" /dev/null); if [ -n "$hits" ]; then echo "$hits"; exit 1; fi' --
      - id: fuzz-seed-size
        name: fuzz seeds are at most 4 KiB
        language: system
        files: (^|/)testdata/fuzz/
        # Seeds are synthetic; a larger file may be ROM or bench-read content,
        # which is never committed. Allowlist a legitimately larger synthetic
        # seed by adding its path here: exclude: ^path/to/seed$
        entry: bash -c 'big=$(find "$@" -size +4096c); if [ -n "$big" ]; then echo "$big"; exit 1; fi' --
      - id: gazelle
        name: BUILD files match Gazelle and Buildifier output
        language: python
        entry: scripts/gazelle_check.py
        pass_filenames: false
        stages: [pre-push]
        files: '(\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$)|((^|/)BUILD\.bazel$)|(\.bzl$)|(^MODULE\.bazel$)|(^\.pre-commit-config\.yaml$)|(^scripts/(gazelle_check|tests/gazelle_check_test)\.py$)'

      - id: clang-tidy-configs
        name: clang-tidy configuration chains are current
        language: python
        additional_dependencies: [pyyaml]
        entry: scripts/clang_tidy_configs.py
        pass_filenames: false
        stages: [pre-push]
        files: '((^|/)\.clang-tidy$)|((^|/)BUILD\.bazel$)|(^bazel/clang_tidy_config_chains\.bzl$)|(^scripts/(tests/)?clang_tidy_configs(_test)?\.py$)'

  - repo: https://github.com/lycheeverse/lychee.git
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        files: \.md$
        # LYCHEE_VERSION must match `rev` above -- kept explicit because git worktrees break the hook's own version auto-detection (git-describe sees GIT_DIR pointed at this repo, not its clone) and fail commits with exit 100.
        args: [LYCHEE_VERSION=0.24.2, --no-progress, --include-fragments, --offline]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$

  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.5.1.1
    hooks:
      - id: buildifier
      - id: buildifier-lint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
