repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: no-commit-to-branch
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: pragma-once
        name: require pragma once in headers
        language: system
        files: \.(h|hh|hpp|hxx)$
        entry: bash -c 'missing=$(grep -L "^#pragma once" "$@"); if [ -n "$missing" ]; then echo "$missing"; exit 1; fi' --

      # Always scans every tracked .md rather than just the staged ones: a
      # reference breaks when its *target* moves or is deleted, and the file
      # holding the stale reference is not part of that commit. Whole-repo
      # scan costs ~40ms.
      - id: markdown-links
        name: check markdown links resolve
        language: system
        always_run: true
        pass_filenames: false
        entry: python3 scripts/check-markdown-links.py

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$

  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.5.1.1
    hooks:
      - id: buildifier
      - id: buildifier-lint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
