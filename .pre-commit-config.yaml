repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: no-commit-to-branch
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: pragma-once
        name: require pragma once in headers
        language: system
        files: \.(h|hh|hpp|hxx)$
        entry: bash -c 'missing=$(grep -L "^#pragma once" "$@"); if [ -n "$missing" ]; then echo "$missing"; exit 1; fi' --

  - repo: https://github.com/lycheeverse/lychee.git
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        files: \.md$
        # LYCHEE_VERSION must be kept in sync with `rev` above. It is not
        # redundant: without it the hook script derives the version by running
        # `git describe` inside its own clone, which `git commit` breaks by
        # exporting GIT_DIR -- absolute in a git worktree, so the lookup hits
        # this repo instead and fails with exit 100. Passing the version
        # explicitly short-circuits that detection (documented escape hatch in
        # the hook's .pre-commit-hooks.yaml) and lets .md files be committed
        # from worktrees, not just the main checkout.
        args: [LYCHEE_VERSION=0.24.2, --no-progress, --include-fragments, --cache, --max-cache-age, 1d]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$

  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.5.1.1
    hooks:
      - id: buildifier
      - id: buildifier-lint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
