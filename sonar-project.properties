sonar.projectKey=RcusStackwalker_FastECU
sonar.organization=rcusstackwalker
sonar.projectName=FastECU
sonar.host.url=https://sonarcloud.io
sonar.cfamily.compile-commands=compile_commands.json

sonar.sources=apps,packaging,resources/shared,scripts,src,tools
# Shared roots are intentional: test inclusions filter within sonar.tests,
# and the scanner automatically excludes those patterns from production scope.
# Python tooling uses owner-local tests/ directories; the plugin also has LLVM
# fixtures in test/ and load checks in smoke/. Do not match *_test.py globally:
# scripts/mutation_test.py is production tooling. See docs/coding-style.md.
sonar.tests=tests,src,apps,resources/shared,scripts,tools,packaging
sonar.test.inclusions=\
  tests/**,\
  src/**/testing/**,\
  src/**/*_test.cpp,\
  src/**/*_test.h,\
  src/**/*_main.cpp,\
  apps/**/testing/**,\
  apps/**/*_test.cpp,\
  apps/**/*_test.h,\
  resources/shared/**/*_test.cpp,\
  scripts/tests/**,\
  tools/**/tests/**,\
  tools/clang-tidy/plugin/test/**,\
  tools/clang-tidy/plugin/smoke/**,\
  packaging/tests/**

sonar.cfamily.llvm-cov.reportPath=coverage/llvm-cov.report

# Silence the Python-3-version analysis hint by pinning the toolchain version
# (matches the rules_python 3.14 toolchain in MODULE.bazel).
sonar.python.version=3.14

# src/platform/desktop/windows/** is excluded because it is NOT being
# analysed, not because it is clean. The SonarCloud job runs on Linux
# (.github/workflows/sonar.yml), so the Windows-only sources never compile
# and never enter compile_commands.json; the CFamily analyser
# skips every file it cannot find there. The result was a silent blind spot
# -- all ten files reported zero issues while the sibling J2534_unix.cpp
# reported 248 -- over the most security-sensitive code in the tree (raw
# vendor-DLL marshalling). Excluding them states that plainly instead of
# letting an empty issue list read as a clean bill of health.
#
# The honest fix is a Windows leg that contributes its own compile database so
# these files are actually analysed; until then they are reviewed by hand. Drop this
# exclusion the moment such a leg exists.
sonar.exclusions=\
  resources/shared/kernels/**,\
  src/platform/desktop/windows/**,\
  **/__pycache__/**

# False positives: the Sonar tooling under tools/sonar/ takes its input and
# output directories from CLI arguments by design and runs only in CI or on a
# developer machine against the developer's own checkout; the coverage import
# validates report paths against `..` and escaping the checkout. Python taint
# analysis reports every such path as traversal or a filesystem oracle. Scope is
# limited to these two rules and this directory.
sonar.issue.ignore.multicriteria=sonarTools1,sonarTools2
sonar.issue.ignore.multicriteria.sonarTools1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.sonarTools1.resourceKey=tools/sonar/**
sonar.issue.ignore.multicriteria.sonarTools2.ruleKey=pythonsecurity:S6549
sonar.issue.ignore.multicriteria.sonarTools2.resourceKey=tools/sonar/**

# False positive: CPD normalises string literals, so the P/B/C/U tables collide on shared code ranges.
# The built-in catalog is explicit data: repeated rows preserve values, order,
# IDs and aliases. CPD ignores string-literal differences between those rows.
sonar.cpd.exclusions=\
  src/algorithms/diagnostics/dtc_tables.cpp,\
  src/backend/config/builtin_catalog.cpp

sonar.coverage.exclusions=\
  tests/**,\
  src/**/testing/**,\
  src/**/*_test.cpp,\
  src/**/*_test.h,\
  src/**/*_main.cpp,\
  apps/**/testing/**,\
  apps/**/*_test.cpp,\
  apps/**/*_test.h,\
  resources/shared/**/*_test.cpp,\
  src/ui/desktop/hexedit/**,\
  scripts/**,\
  tools/**,\
  packaging/**,\
  **/moc_*,\
  **/ui_*,\
  **/qrc_*,\
  **/rep_*_replica.h
