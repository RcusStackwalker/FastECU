sonar.projectKey=RcusStackwalker_FastECU
sonar.organization=rcusstackwalker
sonar.projectName=FastECU
sonar.host.url=https://sonarcloud.io
sonar.cfamily.compile-commands=bw-output/compile_commands.json

sonar.sources=apps,resources/shared,scripts,src
# resources/shared is listed as both a source and a test root on purpose: it
# holds production config (config/*.cfg) alongside the *_test.cpp suites that
# pin that config's contents. sonar.test.inclusions only filters within
# sonar.tests roots, so listing the directory there is what lets the pattern
# below reach those files -- without it they analyse as production code and
# their getenv("PROTOCOLS_CFG_PATH") -> ifstream reads (Bazel's $(location)
# wiring, see resources/shared/BUILD.bazel) raise BLOCKER path-injection
# findings that do not apply to a test binary.
sonar.tests=tests,src,resources/shared
sonar.test.inclusions=tests/**,src/**/testing/**,src/**/*_test.cpp,src/**/*_test.h,src/**/*_main.cpp,resources/shared/**/*_test.cpp

sonar.cfamily.llvm-cov.reportPath=coverage/llvm-cov.report

# Silence the Python-3-version analysis hint by pinning the toolchain version
# (matches the rules_python 3.14 toolchain in MODULE.bazel).
sonar.python.version=3.14

sonar.exclusions=\
  resources/shared/kernels/**,\
  **/__pycache__/**

sonar.coverage.exclusions=\
  tests/**,\
  src/**/testing/**,\
  src/**/*_test.cpp,\
  src/**/*_test.h,\
  src/**/*_main.cpp,\
  resources/shared/**/*_test.cpp,\
  src/ui/desktop/hexedit/**,\
  scripts/**,\
  **/moc_*,\
  **/ui_*,\
  **/qrc_*,\
  **/rep_*_replica.h
