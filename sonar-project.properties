sonar.projectKey=RcusStackwalker_FastECU
sonar.organization=rcusstackwalker
sonar.projectName=FastECU
sonar.host.url=https://sonarcloud.io
sonar.cfamily.compile-commands=sonar-inputs/compile_commands.json

sonar.sources=apps,packaging,resources/shared,scripts,src,tools
# Shared roots are intentional: test inclusions filter within sonar.tests,
# and the scanner automatically excludes those patterns from production scope.
# Python tooling uses owner-local tests/ directories; the plugin also has LLVM
# fixtures in test/ and load checks in smoke/. Do not match *_test.py globally:
# scripts/mutation_test.py is production tooling. See docs/coding-style.md.
sonar.tests=tests,src,apps,resources/shared,scripts,tools,packaging
sonar.test.inclusions=\
  tests/**,\
  src/**/testing/**,\
  src/**/*_test.cpp,\
  src/**/*_test.h,\
  src/**/*_main.cpp,\
  apps/**/testing/**,\
  apps/**/*_test.cpp,\
  apps/**/*_test.h,\
  resources/shared/**/*_test.cpp,\
  scripts/tests/**,\
  tools/**/tests/**,\
  tools/clang-tidy/plugin/test/**,\
  tools/clang-tidy/plugin/smoke/**,\
  packaging/tests/**

sonar.coverageReportPaths=coverage/sonar-coverage.xml

# Silence the Python-3-version analysis hint by pinning the toolchain version
# (matches the rules_python 3.14 toolchain in MODULE.bazel).
sonar.python.version=3.14

# src/platform/desktop/windows/** is excluded because it is NOT being
# analysed, not because it is clean. The SonarCloud job runs on Linux
# (.github/workflows/sonar.yml), so the Windows-only sources never compile
# and never enter compile_commands.json; the CFamily analyser
# skips every file it cannot find there. The result was a silent blind spot
# -- all ten files reported zero issues while the sibling J2534_unix.cpp
# reported 248 -- over the most security-sensitive code in the tree (raw
# vendor-DLL marshalling). Excluding them states that plainly instead of
# letting an empty issue list read as a clean bill of health.
#
# The honest fix is a Windows leg that contributes its own compile database so
# these files are actually analysed; until then they are reviewed by hand. Drop this
# exclusion the moment such a leg exists.
sonar.exclusions=\
  resources/shared/kernels/**,\
  src/platform/desktop/windows/**,\
  **/__pycache__/**

# False positives: the Sonar tooling under tools/sonar/ takes its input and
# output directories from CLI arguments by design and runs only in CI or on a
# developer machine against the developer's own checkout; the coverage report
# (tools/sonar/coverage_report.py) drops report paths that are absolute, contain
# `..`, or do not resolve to a file in the checkout. Python taint
# analysis reports every such path as traversal or a filesystem oracle. The
# scanner launcher (tools/sonar/sonar_scan.py) forwards its CLI arguments to the
# pinned scanner by design, which taint analysis reports as argument injection.
# Scope is limited to these three rules and this directory.
#
# The same false positives cover two other CLI-only build tools. The mutation
# runner (scripts/mutation_test.py) takes Bazel labels, a diff ref and report
# directories from its own CLI and runs them against the developer's checkout.
# The release assembler (packaging/assemble.py) is invoked only by the
# qt_deploy_zip Bazel rule with paths Bazel chooses. Neither handles input from
# a network or other untrusted source.
#
# cpp:S3608 and cpp:S5019 (explicit lambda captures) conflict with the coding
# style: and_then/transform chain lambdas run before the enclosing call returns
# and capture with `[&]` (docs/coding-style.md#error-handling), so both rules
# are off everywhere.
sonar.issue.ignore.multicriteria=sonarTools1,sonarTools2,sonarTools3,mutation1,mutation2,packaging1,lambdaCapture1,lambdaCapture2
sonar.issue.ignore.multicriteria.sonarTools1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.sonarTools1.resourceKey=tools/sonar/**
sonar.issue.ignore.multicriteria.sonarTools2.ruleKey=pythonsecurity:S6549
sonar.issue.ignore.multicriteria.sonarTools2.resourceKey=tools/sonar/**
sonar.issue.ignore.multicriteria.sonarTools3.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.sonarTools3.resourceKey=tools/sonar/**
sonar.issue.ignore.multicriteria.mutation1.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.mutation1.resourceKey=scripts/mutation_test.py
sonar.issue.ignore.multicriteria.mutation2.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.mutation2.resourceKey=scripts/mutation_test.py
sonar.issue.ignore.multicriteria.packaging1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.packaging1.resourceKey=packaging/assemble.py
sonar.issue.ignore.multicriteria.lambdaCapture1.ruleKey=cpp:S3608
sonar.issue.ignore.multicriteria.lambdaCapture1.resourceKey=**
sonar.issue.ignore.multicriteria.lambdaCapture2.ruleKey=cpp:S5019
sonar.issue.ignore.multicriteria.lambdaCapture2.resourceKey=**

# False positive: CPD normalises string literals, so the P/B/C/U tables collide on shared code ranges.
# The built-in catalog is explicit data: repeated rows preserve values, order,
# IDs and aliases. CPD ignores string-literal differences between those rows.
# Denso bootloader dialect profiles are explicit per-family data: sibling
# families legitimately share most values, and each field carries its own
# legacy citation, so CPD's repeated-block match is not copy-paste. Each
# profile lives in its family's *_plan.h (one header per flash family); a
# rename of these headers must carry the exclusion with it.
sonar.cpd.exclusions=\
  src/algorithms/diagnostics/dtc_tables.cpp,\
  src/backend/config/builtin_catalog.cpp,\
  src/backend/flash/ecu/subaru_denso_1n83m_1_5m_can_plan.h,\
  src/backend/flash/ecu/subaru_denso_1n83m_4m_can_plan.h,\
  src/backend/flash/ecu/subaru_denso_sh72531_can_plan.h,\
  src/backend/flash/ecu/subaru_denso_sh72543_can_diesel_plan.h

sonar.coverage.exclusions=\
  tests/**,\
  src/**/testing/**,\
  src/**/*_test.cpp,\
  src/**/*_test.h,\
  src/**/*_main.cpp,\
  apps/**/testing/**,\
  apps/**/*_test.cpp,\
  apps/**/*_test.h,\
  resources/shared/**/*_test.cpp,\
  src/ui/desktop/hexedit/**,\
  scripts/**,\
  tools/**,\
  packaging/**,\
  **/moc_*,\
  **/ui_*,\
  **/qrc_*,\
  **/rep_*_replica.h
