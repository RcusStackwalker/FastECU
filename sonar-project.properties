sonar.projectKey=RcusStackwalker_FastECU
sonar.organization=rcusstackwalker
sonar.projectName=FastECU
sonar.host.url=https://sonarcloud.io
sonar.cfamily.compile-commands=bw-output/compile_commands.json

sonar.sources=apps,resources/shared,scripts,src
# resources/shared is listed as both a source and a test root on purpose: it
# holds production config (config/*.cfg) alongside the *_test.cpp suites that
# pin that config's contents. sonar.test.inclusions only filters within
# sonar.tests roots, so listing the directory there is what lets the pattern
# below reach those files -- without it they analyse as production code and
# their getenv("PROTOCOLS_CFG_PATH") -> ifstream reads (Bazel's $(location)
# wiring, see resources/shared/BUILD.bazel) raise BLOCKER path-injection
# findings that do not apply to a test binary.
# apps is listed here for the same reason as src and resources/shared: its
# suites live beside the code they test (apps/bench/*_test.cpp, and the fakes
# under apps/bench/testing/). Without it they analyse as production code, and
# a test that opens a file under $TEST_TMPDIR raises a BLOCKER path-injection
# finding that does not apply to a test binary.
sonar.tests=tests,src,apps,resources/shared
sonar.test.inclusions=tests/**,src/**/testing/**,src/**/*_test.cpp,src/**/*_test.h,src/**/*_main.cpp,apps/**/testing/**,apps/**/*_test.cpp,apps/**/*_test.h,resources/shared/**/*_test.cpp

sonar.cfamily.llvm-cov.reportPath=coverage/llvm-cov.report

# Silence the Python-3-version analysis hint by pinning the toolchain version
# (matches the rules_python 3.14 toolchain in MODULE.bazel).
sonar.python.version=3.14

# src/platform/desktop/windows/** is excluded because it is NOT being
# analysed, not because it is clean. The SonarCloud job runs on Linux
# (.github/workflows/sonar.yml), so the Windows-only sources never compile
# and never enter bw-output/compile_commands.json; the CFamily analyser
# skips every file it cannot find there. The result was a silent blind spot
# -- all ten files reported zero issues while the sibling J2534_unix.cpp
# reported 248 -- over the most security-sensitive code in the tree (raw
# vendor-DLL marshalling). Excluding them states that plainly instead of
# letting an empty issue list read as a clean bill of health.
#
# The honest fix is a Windows leg for the build wrapper so these files are
# actually analysed; until then they are reviewed by hand. Drop this
# exclusion the moment such a leg exists.
sonar.exclusions=\
  resources/shared/kernels/**,\
  src/platform/desktop/windows/**,\
  **/__pycache__/**

# False positive: CPD normalises string literals, so the P/B/C/U tables collide on shared code ranges.
sonar.cpd.exclusions=src/algorithms/diagnostics/dtc_tables.cpp

sonar.coverage.exclusions=\
  tests/**,\
  src/**/testing/**,\
  src/**/*_test.cpp,\
  src/**/*_test.h,\
  src/**/*_main.cpp,\
  apps/**/testing/**,\
  apps/**/*_test.cpp,\
  apps/**/*_test.h,\
  resources/shared/**/*_test.cpp,\
  src/ui/desktop/hexedit/**,\
  scripts/**,\
  **/moc_*,\
  **/ui_*,\
  **/qrc_*,\
  **/rep_*_replica.h
