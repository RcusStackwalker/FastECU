# Which OS runs clang-tidy over platform-gated code. Linux's job analyzes every
# eligible configured source in its host graph; other OSes report only their
# exclusive code. Prefixes are workspace-relative directories, forward slashes.
#
# Every BUILD.bazel that sets target_compatible_with (or select()s on an
# @platforms//os: constraint) and has C/C++ sources must
# fall under a prefix below, or the scope guard fails. When it does, decide:
# exclusive to one OS -> [os.<name>]; otherwise already built (and so analyzed)
# on Linux -> [linux_covered].

[os.windows]
prefixes = [
  "apps/desktop",
  "bazel/platforms",
  "src/platform/desktop/windows",
  "src/platform/desktop/common/serial",
  "tests",
]

[linux_covered]
prefixes = [
  "apps/bench",
  "src/platform/desktop/common/connection/testing",
  "src/ui/desktop/widgets",
  "src/platform/desktop/unix/j2534",
  "src/platform/desktop/common/serial/direct/unix",
  # Manual analysis tooling stays outside the application analysis graph.
  # Native compilation, real-dependency fixtures and the configured-graph test
  # run explicitly in analysis CI; reachable headers use the common filter.
  "tools/clang-tidy/plugin",
  "tools/clang-tidy/aspect/tests",
]
