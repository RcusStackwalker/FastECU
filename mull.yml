# Mull mutation testing (scripts/mutation_test.py, ADR 0022). Read by the
# compiler plugin through MULL_CONFIG and by mull-runner; the script adds
# gitDiffRef/gitProjectRoot for a PR's changed lines.
#
# Portable code only, never the tests or test helpers that judge the mutants.
includePaths:
  - '.*/src/(algorithms|backend)/.*'
excludePaths:
  - '.*/external/.*'
  - '.*_test\.(c|cc|cpp|h)$'
  - '.*/testing/.*'
# Junk detection re-parses each mutated file from the flags that
# -grecord-command-line stored. The re-parse is syntax-only, so the driver warns
# that Bazel's `-c` is unused. These flags apply only to the re-parse.
# -Qunused-arguments silences the warning; -Wno-unused-command-line-argument
# cannot, because the driver reports it before -W options take effect.
compilerFlags:
  - -Qunused-arguments
