name: Qt runtime libraries (Linux)
description: >-
  Install the system libraries Qt's prebuilt Linux libraries link against that
  the runner image may lack (EGL/GL, xkbcommon, fontconfig, dbus, glib). Qt
  itself comes from Bazel (rules_qt). Tests run on the offscreen platform, so
  the xcb libraries (used only by Qt's xcb platform plugin) are not needed.
runs:
  using: composite
  steps:
    - name: Install Qt runtime libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
