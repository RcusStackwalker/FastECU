name: pr

on:
  pull_request:
    branches: [master, "feat/clang-tidy-plugin-enforcement", "stack/clang-tidy-*"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The clang-tidy job's LLVM, which the sanitizer job reuses: the official
  # llvm-project release tarball on both OSes, so they run the identical build
  # and a runner-image or package-feed bump cannot change what the gates flag.
  # Neither Chocolatey nor the Ubuntu archive carries 23 yet. Moving the version
  # means updating both checksums (the `digest` of each asset on the GitHub
  # release page).
  CLANG_TIDY_LLVM_VERSION: '23.1.4'
  CLANG_TIDY_LLVM_SHA256_LINUX: '25d814fda50d5fb0084b42be09605d8b1595d49d5e2e03a3345d7e112ff6f9f3'
  CLANG_TIDY_LLVM_SHA256_WINDOWS: '854bffcfc84528e0ee92490ff5c178920abd358a79c3e98f053e41e3e8e4c6d2'

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install prek
        run: pipx install prek

      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: prek run --all-files
        env:
          GITHUB_TOKEN: ${{ github.token }} # authenticates binstall/lychee GitHub requests

  gazelle:
    name: gazelle (BUILD files)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Install prek
        run: pipx install prek

      - name: Check BUILD files are up to date
        run: prek run gazelle --hook-stage pre-push --all-files

      - name: Check clang-tidy configuration chains are up to date
        run: prek run clang-tidy-configs --hook-stage pre-push --all-files

  android-cross-compile:
    name: Portable core (platform-free, Android build)
    needs: pre-commit
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      # Compile/link only: the gate is that everything under src/backend and
      # src/algorithms builds with the NDK. Uses the NDK preinstalled on the runner image.
      - name: Check portable core reaches no platform code and builds for Android arm64
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          scripts/android-cross-compile.sh

  sonarcloud:
    name: SonarCloud
    needs: pre-commit
    uses: ./.github/workflows/sonar.yml
    with:
      ref: ${{ github.sha }}
      cache-save: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  bazel:
    name: Bazel (${{ matrix.os }})
    needs: pre-commit
    runs-on: ${{ matrix.os }}
    # Bound a wedged runner before GitHub's six-hour default.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-26.04]
        include:
          # The release platforms also package; Linux has no archive.
          - os: windows-latest
            platform: windows
            package: windows_zip
          - os: macos-latest
            platform: macos
            package: macos_zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/qt-runtime-linux
        if: runner.os == 'Linux'

      - uses: ./.github/actions/llvm-bazel-prereqs
        if: runner.os != 'Linux'

      - name: Build Bazel targets
        run: |
          bazel build -k --config=release //...

      - name: Build x64 pe_bitness fixture (Windows)
        if: runner.os == 'Windows'
        run: |
          bazel build -k --config=release //src/platform/desktop/windows/j2534:pe_bitness_x64_fixture

      - name: Test Bazel targets
        run: |
          bazel test -k --config=release //...

      - name: Package from Bazel (verify only)
        if: matrix.package
        env:
          # Git Bash would rewrite the leading "//" of the Bazel label to "/".
          MSYS_NO_PATHCONV: '1'
        run: bazel build --config=release --define=FASTECU_VERSION=${{ github.sha }} //packaging:${{ matrix.package }}

      - name: Upload Bazel package (verify only)
        if: matrix.package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastecu-bazelpkg-${{ github.event.pull_request.number || github.sha }}-${{ matrix.platform }}
          path: bazel-bin/packaging/${{ matrix.package }}.zip
          retention-days: 14

  sanitizers:
    name: Sanitizers and fuzz seeds (ASan + UBSan)
    needs: pre-commit
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/llvm-release
        with:
          version: ${{ env.CLANG_TIDY_LLVM_VERSION }}
          sha256: ${{ env.CLANG_TIDY_LLVM_SHA256_LINUX }}

      # Portable tests and fuzz harnesses under ASan + UBSan; the harnesses run
      # in FuzzTest's unit-test mode, replaying every committed seed.
      - name: Test portable code under sanitizers
        run: |
          bazel test -k --config=asan //src/algorithms/... //src/backend/...

  mutation:
    name: Mutation testing (changed lines, advisory)
    needs: pre-commit
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      # Full history: the script diffs the PR against its base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/mull-linux

      # Surviving mutants on the PR's lines become warnings in the diff and a
      # table in the job summary; they never fail the job (ADR 0022).
      - name: Mutate the lines this PR changes
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          python3 scripts/mutation_test.py --diff-ref "${BASE_REF}" \
            --summary "$GITHUB_STEP_SUMMARY" --annotate --report-dir mull-reports

      # The sonar-dedup verdict reads these; it does not run Mull again (ADR 0029).
      # The marker makes the artifact exist even when nothing was mutated, so a
      # failed download fails the verdict instead of reading as "no survivors".
      - name: Mark the mutation reports
        run: mkdir -p mull-reports && touch mull-reports/.uploaded

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-reports
          path: mull-reports
          include-hidden-files: true

  # The merge rules of a `sonar-dedup` loop PR (ADR 0029): NLOC drops by at
  # least 10, and the PR adds no duplicated lines, no uncovered lines and no
  # surviving mutants. Changed-line coverage and new duplication come only from
  # the SonarCloud job, so this waits for it. It runs on every PR and reads the
  # labels when it starts: `gh pr create --label` labels the PR after the
  # `opened` event, whose payload would not show the label yet.
  sonar-dedup-verdict:
    name: sonar-dedup verdict
    needs: [sonarcloud, mutation]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Skip PRs that are not loop PRs
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "${PR}" --repo "${GITHUB_REPOSITORY}" --json labels \
              --jq '.labels[].name' | grep -qx sonar-dedup; then
            echo "loop=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not labelled sonar-dedup; nothing to check." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A skipped or failed job would otherwise leave this check skipped, which
      # reads as passing.
      - name: Require the SonarCloud and mutation jobs
        if: steps.label.outputs.loop == 'true'
        env:
          SONAR: ${{ needs.sonarcloud.result }}
          MUTATION: ${{ needs.mutation.result }}
        run: |
          if [ "${SONAR}" != success ] || [ "${MUTATION}" != success ]; then
            echo "sonarcloud: ${SONAR}, mutation: ${MUTATION}; both must succeed" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.label.outputs.loop == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install prek
        if: steps.label.outputs.loop == 'true'
        run: pipx install prek

      - name: Cache prek hook environments
        if: steps.label.outputs.loop == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.label.outputs.loop == 'true'
        with:
          name: mutation-reports
          path: mull-reports

      # The base's copy of the script judges the PR, so a PR cannot change its
      # own verdict; the verdict fails a PR that changes the loop's tooling.
      - name: Check the loop PR's merge rules
        if: steps.label.outputs.loop == 'true'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          base="$(git merge-base "${BASE_REF}" HEAD)"
          git worktree add ../base "${base}"
          verdict=../base/scripts/dedup_loop.py
          before="$(python3 "${verdict}" --root ../base measure --json | jq -e .total)"
          after="$(python3 "${verdict}" --root . measure --json | jq -e .total)"
          git diff --name-only "${base}" HEAD > "${RUNNER_TEMP}/changed.txt"
          python3 "${verdict}" --root . verdict --pr "${PR}" --head-sha "${HEAD_SHA}" \
            --nloc-before "${before}" --nloc-after "${after}" \
            --changed-file "${RUNNER_TEMP}/changed.txt" --mutation-reports mull-reports \
            | tee -a "$GITHUB_STEP_SUMMARY"

  clang-tidy:
    name: clang-tidy (${{ matrix.os }})
    needs: pre-commit
    runs-on: ${{ matrix.os }}
    # A configuration/tool change can invalidate the complete analysis scope.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            scope: ''
          - os: windows-latest
            scope: '--scope-os windows'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/qt-runtime-linux
        if: runner.os == 'Linux'

      # The analysis executable and repository checks share this pinned install.
      - uses: ./.github/actions/llvm-release
        with:
          version: ${{ env.CLANG_TIDY_LLVM_VERSION }}
          sha256: ${{ runner.os == 'Windows' && env.CLANG_TIDY_LLVM_SHA256_WINDOWS || env.CLANG_TIDY_LLVM_SHA256_LINUX }}

      - name: Select LLVM compiler for the Linux analysis extension
        if: runner.os == 'Linux'
        run: |
          echo "CC=$FASTECU_LLVM_ROOT/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$FASTECU_LLVM_ROOT/bin/clang++" >> "$GITHUB_ENV"

      - name: clang-tidy configured-graph regression
        run: bazel test --config=release //tools/clang-tidy/aspect/tests:transition_outputs_test

      # Windows copies runfiles into the tree before a local test prefetches remote
      # cache hits, so the default toplevel download leaves unreadable entries.
      # lit finds Git for Windows' Unix tools itself, but resolves `cp` to cp.exe
      # through PATHEXT, which `bazel test` drops from the test environment.
      - name: clang-tidy module fixtures
        run: >-
          bazel test --config=release --remote_download_outputs=all --test_env=PATHEXT
          //tools/clang-tidy/scripts:clang_tidy_check_fixtures

      - name: clang-tidy report
        run: |
          bazel run --config=release //:clang_tidy -- --profile --annotate ${{ matrix.scope }}
