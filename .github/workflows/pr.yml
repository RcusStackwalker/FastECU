name: pr

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_MODULES: qtcharts qtserialport qtremoteobjects qtwebsockets
  # rules_qt supports Bazel builds on Qt 6.8.3.
  QT_VERSION: '6.8.3'
  # The clang-tidy job's LLVM: the official llvm-project release tarball on both
  # OSes, so they run the identical build and a runner-image or package-feed
  # bump cannot change what the gate flags. Neither Chocolatey nor the Ubuntu
  # archive carries 23 yet. Moving the version means updating both checksums
  # (the `digest` of each asset on the GitHub release page).
  CLANG_TIDY_LLVM_VERSION: '23.1.2'
  CLANG_TIDY_LLVM_SHA256_LINUX: 'b5ed9675149cc837c282e9b6962c276c9fa62863d5b2f91537b60848552995b7'
  CLANG_TIDY_LLVM_SHA256_WINDOWS: '8fb91cdc44fcbbdcf6b3ffd0a1f9859abd14a3c3aae4423c2b6d4a4f90bf0095'

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install prek
        run: pipx install prek

      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: prek run --all-files
        env:
          GITHUB_TOKEN: ${{ github.token }} # authenticates binstall/lychee GitHub requests

  gazelle:
    name: gazelle (BUILD files)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      # Mirrors the Bazel job so module resolution sees the same host tools; drop
      # it if a run shows gazelle resolving without Qt.
      - name: Install Qt for host tools (Linux)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - name: Install prek
        run: pipx install prek

      - name: Check BUILD files are up to date
        run: prek run gazelle --hook-stage pre-push --all-files

  android-cross-compile:
    name: Portable core (platform-free, Android build)
    needs: pre-commit
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      # Module resolution needs the same host Qt tools as the Bazel job.
      - name: Install Qt for host tools (Linux)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      # Compile/link only: the gate is that everything under src/backend and
      # src/algorithms builds with the NDK. Uses the NDK preinstalled on the runner image.
      - name: Check portable core reaches no platform code and builds for Android arm64
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          scripts/android-cross-compile.sh

  sonarcloud:
    name: SonarCloud
    needs: pre-commit
    uses: ./.github/workflows/sonar.yml
    with:
      ref: ${{ github.sha }}
      cache-save: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  bazel:
    name: Bazel (${{ matrix.os }})
    needs: pre-commit
    runs-on: ${{ matrix.os }}
    # A wedged runner here would otherwise burn the full 6h GitHub default
    # before failing -- the Windows job did exactly that for weeks, walking
    # Bazel's output base in the clang-tidy step (fixed in
    # scripts/clang_tidy_runner.py) and hanging so hard it stopped honouring
    # step-level timeout-minutes. Same reasoning as sonar.yml's own 60.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-26.04]
        include:
          # The release platforms also package; Linux has no archive.
          - os: windows-latest
            platform: windows
            package: windows_zip
          - os: macos-latest
            platform: macos
            package: macos_zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Install Qt for host tools (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          modules: ${{ env.QT_MODULES }}
          add-tools-to-path: true

      - name: Install Qt for host tools (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - name: Install Qt for host tools (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - name: Install Bazel prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Bazel prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Build Bazel targets
        run: |
          bazel build -k --config=release //...

      - name: Build x64 pe_bitness fixture (Windows)
        if: runner.os == 'Windows'
        run: |
          bazel build -k --config=release //src/platform/desktop/windows/j2534:pe_bitness_x64_fixture

      - name: Test Bazel targets
        run: |
          bazel test -k --config=release //...

      - name: Package from Bazel (verify only)
        if: matrix.package
        shell: bash
        env:
          # Git Bash would rewrite the leading "//" of the Bazel label to "/".
          MSYS_NO_PATHCONV: '1'
        run: bazel build --config=release --define=FASTECU_VERSION=${{ github.sha }} //packaging:${{ matrix.package }}

      - name: Upload Bazel package (verify only)
        if: matrix.package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastecu-bazelpkg-${{ github.event.pull_request.number || github.sha }}-${{ matrix.platform }}
          path: bazel-bin/packaging/${{ matrix.package }}.zip
          retention-days: 14

  clang-tidy:
    name: clang-tidy (${{ matrix.os }})
    needs: pre-commit
    runs-on: ${{ matrix.os }}
    # 120, not 30: a .clang-tidy change makes the run whole-tree
    # (scripts/clang_tidy_runner.py), whose analysis ran past 58 minutes on a
    # 4-core runner and was cancelled at the earlier 60-minute limit (#480).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            scope: ''
          - os: windows-latest
            scope: '--scope-os windows'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Install Qt for host tools (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          modules: ${{ env.QT_MODULES }}
          add-tools-to-path: true

      - name: Install Qt for host tools (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - name: Install clang-tidy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:CLANG_TIDY_LLVM_VERSION
          $name = "clang+llvm-$ver-x86_64-pc-windows-msvc.tar.xz"
          $archive = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/$name" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:CLANG_TIDY_LLVM_SHA256_WINDOWS) {
            throw "SHA-256 mismatch for ${name}: expected $env:CLANG_TIDY_LLVM_SHA256_WINDOWS, got $actual"
          }
          $dest = Join-Path $env:RUNNER_TEMP 'llvm'
          New-Item -ItemType Directory -Path $dest | Out-Null
          tar -xf $archive -C $dest --strip-components=1
          Remove-Item $archive
          Join-Path $dest 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install clang-tidy (Linux)
        if: runner.os == 'Linux'
        run: |
          name="LLVM-${CLANG_TIDY_LLVM_VERSION}-Linux-X64.tar.xz"
          archive="${RUNNER_TEMP}/${name}"
          curl -fsSL --retry 3 -o "${archive}" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${CLANG_TIDY_LLVM_VERSION}/${name}"
          echo "${CLANG_TIDY_LLVM_SHA256_LINUX}  ${archive}" | sha256sum --check --strict
          mkdir "${RUNNER_TEMP}/llvm"
          tar -xJf "${archive}" -C "${RUNNER_TEMP}/llvm" --strip-components=1
          rm "${archive}"
          # The tarball ships unversioned clang-tidy and run-clang-tidy, which
          # is where the runner looks them up.
          echo "${RUNNER_TEMP}/llvm/bin" >> "$GITHUB_PATH"

      - name: clang-tidy report
        # bash, not the Windows default pwsh: pwsh swallows the `--`, so bazel
        # would read --profile as its own flag ("Expected value after --profile").
        shell: bash
        run: |
          bazel run --config=release //:clang_tidy_report_changed -- --profile ${{ matrix.scope }}
