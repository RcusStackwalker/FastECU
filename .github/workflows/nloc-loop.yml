name: nloc-loop

# Blocking Mull guards for NLOC hill-climbing loop PRs, which carry the
# `nloc-loop` label (ADR 0023). Mutation testing stays advisory for every other
# PR (ADR 0022). The change's kind decides the guard:
#   test-only   the base's tests and the PR's tests run over the same scope
#               (the portable tests that depend on the changed test sources),
#               six duration-balanced shards each; the PR must kill every
#               mutant the base kills.
#   production  the PR's changed lines are mutated; any survivor fails.
# `nloc-loop verdict` is the one check to require.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: nloc-loop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: nloc-loop classify
    if: contains(github.event.pull_request.labels.*.name, 'nloc-loop')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      base: ${{ steps.classify.outputs.base }}
      kind: ${{ steps.classify.outputs.kind }}
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      # The PR head, not the merge commit: master's newer production changes
      # would otherwise change the mutants a test-only PR is compared on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      # The scope unites the tests depending on changed test sources in both
      # checkouts, so a deleted test target still runs on the base. The PR's
      # copy of the scripts queries both.
      - name: Classify the change and select the mutation scope
        id: classify
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(git merge-base "$BASE_REF" "$HEAD_SHA")
          tools="${RUNNER_TEMP}/nloc-loop"
          mkdir -p "$tools"
          cp scripts/nloc_loop.py scripts/mutation_test.py "$tools/"
          kind=$(python3 "$tools/nloc_loop.py" pr-kind --base "$base" --head "$HEAD_SHA")
          scope=""
          if [ "$kind" = test-only ]; then
            tests=$(python3 "$tools/nloc_loop.py" mutation-scope --base "$base" --head "$HEAD_SHA")
            git checkout --quiet "$base"
            tests="$tests $(python3 "$tools/nloc_loop.py" mutation-scope --base "$base" --head "$HEAD_SHA")"
            git checkout --quiet "$HEAD_SHA"
            scope=$(printf '%s\n' $tests | grep '^//' | sort -u | paste -sd ' ' - | sed 's/ / + /g' || true)
          fi
          {
            echo "base=$base"
            echo "kind=$kind"
            echo "scope=$scope"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## NLOC loop PR"
            echo
            echo "Kind: **$kind**; base \`$base\`."
            echo
            echo "Mutation scope: \`${scope:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  mutate:
    name: nloc-loop mutate (${{ matrix.side }} shard ${{ matrix.shard }})
    needs: classify
    if: needs.classify.outputs.kind == 'test-only' && needs.classify.outputs.scope != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      # The verdict names any shard that did not finish.
      fail-fast: false
      matrix:
        # The script's --shard I/6 and the verdict's --shards 6 follow this.
        side: [base, head]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.side == 'base' && needs.classify.outputs.base || github.event.pull_request.head.sha }}

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/mull-linux

      - name: Run Mull over this shard of the scope
        env:
          SCOPE: ${{ needs.classify.outputs.scope }}
          SHARD: ${{ matrix.shard }}
        run: |
          python3 scripts/mutation_test.py --shard "${SHARD}/6" \
            --schedule bazel/mutation-schedule.json --scope "$SCOPE" \
            --report-dir "${RUNNER_TEMP}/mutation"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nloc-loop-mutation-${{ matrix.side }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutation
          if-no-files-found: error
          retention-days: 14

  production:
    name: nloc-loop mutate (changed lines)
    needs: classify
    if: needs.classify.outputs.kind == 'production'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      # Full history: the script diffs the PR against its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/mull-linux

      - name: Mutate the lines this PR changes
        env:
          BASE: ${{ needs.classify.outputs.base }}
        run: |
          python3 scripts/mutation_test.py --diff-ref "$BASE" \
            --report-dir "${RUNNER_TEMP}/mutation" --summary "$GITHUB_STEP_SUMMARY" --annotate

      - name: No surviving mutants on changed lines
        run: |
          set -o pipefail
          python3 scripts/nloc_loop.py guards mutation --reports "${RUNNER_TEMP}/mutation" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  verdict:
    name: nloc-loop verdict
    needs: [classify, mutate, production]
    # Runs after failed or skipped guard jobs so it can report them.
    if: always() && contains(github.event.pull_request.labels.*.name, 'nloc-loop')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.classify.outputs.kind == 'test-only' && needs.classify.outputs.scope != ''
        with:
          pattern: nloc-loop-mutation-base-*
          path: ${{ runner.temp }}/base

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.classify.outputs.kind == 'test-only' && needs.classify.outputs.scope != ''
        with:
          pattern: nloc-loop-mutation-head-*
          path: ${{ runner.temp }}/head

      - name: Decide
        env:
          CLASSIFY: ${{ needs.classify.result }}
          KIND: ${{ needs.classify.outputs.kind }}
          SCOPE: ${{ needs.classify.outputs.scope }}
          PRODUCTION: ${{ needs.production.result }}
        run: |
          set -o pipefail
          if [ "$CLASSIFY" != success ]; then
            echo "classification did not succeed: $CLASSIFY" >&2
            exit 1
          fi
          if [ "$KIND" = production ]; then
            [ "$PRODUCTION" = success ] || { echo "changed-line guard: $PRODUCTION" >&2; exit 1; }
            exit 0
          fi
          if [ -z "$SCOPE" ]; then
            echo "No portable test sources changed; the mutation guard does not apply." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/nloc_loop.py guards mutation --base-reports "${RUNNER_TEMP}/base" \
            --reports "${RUNNER_TEMP}/head" --shards 6 | tee -a "$GITHUB_STEP_SUMMARY"
