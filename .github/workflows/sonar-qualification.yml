name: Sonar aspect qualification

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to qualify (defaults to this workflow revision)
        required: false
        type: string
      cache-save:
        description: Save Bazel cache
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      cache-save:
        required: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: true
      BUILDBUDDY_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read

env:
  CC: clang
  CXX: clang++

jobs:
  coverage:
    name: Coverage producer (candidate)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
      artifact_id: ${{ steps.coverage_upload.outputs.artifact-id }}
      baseline_id: ${{ steps.baseline_upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - id: revision
        name: Resolve the checked-out commit
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ inputs.cache-save || false }}

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/qt-runtime-linux

      - name: Install Clang and LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Build and run tests with coverage
        run: scripts/coverage-local.sh
        env:
          EXTRA_BAZEL_ARGS: --remote_download_regex=.*/_virtual_includes/.*

      - name: Export the completed coverage product
        env:
          PRODUCER_COMMIT: ${{ steps.revision.outputs.commit }}
        run: |
          bazel run --config=coverage //tools/sonar:coverage_artifact -- export \
            --coverage-dir "$GITHUB_WORKSPACE/coverage" \
            --output "$RUNNER_TEMP/sonar-coverage" \
            --commit "$PRODUCER_COMMIT" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --producer-root "$GITHUB_WORKSPACE"

      - id: coverage_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sonar-coverage
          if-no-files-found: error
          retention-days: 14

      # Qualification-only reference: the production workflow keeps its old
      # blocking input path until this candidate has recorded real evidence.
      - name: Collect the legacy extraction baseline
        run: |
          /usr/bin/time -p bazel run --config=coverage //tools/sonar:sonar_qualify -- \
            --collect-baseline --output "$RUNNER_TEMP/sonar-baseline"

      - id: baseline_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sonar-baseline
          if-no-files-found: error
          retention-days: 14

  sonarcloud:
    name: SonarCloud candidate
    needs: coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.coverage.outputs.commit }}

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ inputs.cache-save || false }}

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/qt-runtime-linux

      - name: Install Clang and LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - id: coverage_download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.coverage.outputs.artifact_id }}
          path: ${{ runner.temp }}/sonar-coverage
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.coverage.outputs.baseline_id }}
          path: ${{ runner.temp }}/sonar-baseline
          merge-multiple: true

      - name: Sonar configured-graph regression
        run: bazel test --config=coverage //tools/sonar:graph_outputs_test

      - name: Prepare configured inputs on this fresh runner
        run: /usr/bin/time -p bazel run --config=sonar_inputs //:sonar_inputs -- --qualification-records

      - id: coverage_import
        name: Validate and localize coverage
        env:
          PRODUCER_COMMIT: ${{ needs.coverage.outputs.commit }}
        run: |
          bazel run --config=coverage //tools/sonar:coverage_artifact -- import \
            --artifact-dir "$RUNNER_TEMP/sonar-coverage" \
            --output "$GITHUB_WORKSPACE/coverage" \
            --commit "$PRODUCER_COMMIT" --run-id "$GITHUB_RUN_ID" \
            --consumer-root "$GITHUB_WORKSPACE"

      - name: Compare configured commands and scanner databases
        run: |
          bazel run --config=coverage //tools/sonar:sonar_qualify -- \
            --check-input-closure \
            --baseline "$RUNNER_TEMP/sonar-baseline" \
            --candidate "$GITHUB_WORKSPACE/sonar-inputs" \
            --output "$RUNNER_TEMP/sonar-comparison"

      - name: SonarCloud scan
        id: sonarcloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >-
            -Dsonar.cfamily.compile-commands=sonar-inputs/compile_commands.json
            -Dsonar.verbose=true
            -Dsonar.cfamily.cache.enabled=false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Retain comparison and scan identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sonar-comparison
            .scannerwork/report-task.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
