name: Windows serial verification campaign

# Temporary: only this campaign branch. Remove after preserving its evidence.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  campaign:
    if: github.head_ref == 'chore/windows-serial-campaign'
    name: Serial campaign (${{ matrix.mode }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, sequential]
    env:
      CAMPAIGN_MODE: ${{ matrix.mode }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record environment
        run: |
          $env:CAMPAIGN_DIR = "$env:RUNNER_TEMP/serial-campaign-$env:CAMPAIGN_MODE"
          "CAMPAIGN_DIR=$env:CAMPAIGN_DIR" | Add-Content $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:CAMPAIGN_DIR | Out-Null
          @{
            checkout = (git rev-parse HEAD)
            run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            attempt = $env:GITHUB_RUN_ATTEMPT
            image = $env:ImageOS
            imageVersion = $env:ImageVersion
            mode = $env:CAMPAIGN_MODE
            qt = '6.8.3'
            arch = 'win64_msvc2022_64'
          } | ConvertTo-Json | Set-Content "$env:CAMPAIGN_DIR/environment.json"
          & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -format json |
            Set-Content "$env:CAMPAIGN_DIR/visual-studio.json"

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: fastecu-build-${{ runner.os }}
          cache-save: false

      - name: Install Qt for host tools (Windows)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: qtcharts qtserialport qtremoteobjects qtwebsockets
          add-tools-to-path: true

      - name: Install Bazel prerequisites (Windows)
        run: |
          choco install llvm -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify report failure handling
        run: python scripts/windows_serial_campaign_test.py

      - name: Inventory serial tests
        run: |
          bazel version | Set-Content "$env:CAMPAIGN_DIR/bazel-version.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang --version | Set-Content "$env:CAMPAIGN_DIR/llvm-version.txt"
          $targets = @(bazel query 'tests(//src/platform/desktop/common/serial/...)' --output=label)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targets | Sort-Object | Set-Content "$env:CAMPAIGN_DIR/all-targets.txt"
          # Explicit target_compatible_with exclusions in the current BUILD files.
          $excluded = @(
            '//src/platform/desktop/common/serial:j2534_driver_selection_unix_test',
            '//src/platform/desktop/common/serial/direct/unix:direct_backend_hooks_unix_test',
            '//src/platform/desktop/common/serial/direct/unix:test_direct_backend_pty'
          )
          $excluded | Set-Content "$env:CAMPAIGN_DIR/excluded-unix-targets.txt"
          $targets | Where-Object { $_ -notin $excluded } | Sort-Object |
            Set-Content "$env:CAMPAIGN_DIR/targets.txt"

      - name: Run 50 fresh executions per target
        id: tests
        timeout-minutes: 40
        run: |
          $bazelArgs = @(
            'test', '-k', '--config=release', '--nocache_test_results',
            '--runs_per_test=50', '--flaky_test_attempts=1',
            '--noruns_per_test_detects_flakes', '--test_sharding_strategy=disabled',
            "--build_event_json_file=$env:CAMPAIGN_DIR/events.jsonl",
            '//src/platform/desktop/common/serial/...'
          )
          if ($env:CAMPAIGN_MODE -eq 'sequential') { $bazelArgs += '--local_test_jobs=1' }
          $bazelArgs | ConvertTo-Json | Set-Content "$env:CAMPAIGN_DIR/command.json"
          & bazel @bazelArgs 2>&1 | Tee-Object -FilePath "$env:CAMPAIGN_DIR/bazel.log"
          $code = $LASTEXITCODE
          $code | Set-Content "$env:CAMPAIGN_DIR/exit-code.txt"
          exit $code

      - name: Collect evidence and enforce completeness
        if: always()
        run: |
          $code = -1
          if (Test-Path "$env:CAMPAIGN_DIR/exit-code.txt") {
            $code = [int](Get-Content "$env:CAMPAIGN_DIR/exit-code.txt")
          }
          if (!(Test-Path "$env:CAMPAIGN_DIR/targets.txt")) {
            New-Item -ItemType Directory -Force $env:CAMPAIGN_DIR | Out-Null
            '' | Set-Content "$env:CAMPAIGN_DIR/targets.txt"
          }
          python scripts/windows_serial_campaign.py $env:CAMPAIGN_DIR --runs 50 --exit-code $code
          $reportCode = $LASTEXITCODE
          if (Test-Path "$env:CAMPAIGN_DIR/summary.md") {
            Get-Content "$env:CAMPAIGN_DIR/summary.md" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $reportCode

      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serial-campaign-${{ matrix.mode }}-${{ github.run_attempt }}
          path: ${{ env.CAMPAIGN_DIR }}
          if-no-files-found: error
          retention-days: 30
