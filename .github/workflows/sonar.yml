name: SonarCloud

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to analyze
        required: true
        type: string
      cache-save:
        description: Save Bazel cache
        required: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: true
      BUILDBUDDY_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read

env:
  CC: clang
  CXX: clang++

jobs:
  # One job: a second runner's setup, cold Bazel start and artifact transfer cost
  # more than a separate scanner job's retry boundary was worth. A manual rerun
  # restores the earlier attempt's exported coverage product instead of rebuilding
  # it, and a transient scanner failure is retried once in place.
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-26.04
    # A hang here would otherwise burn the full 6h GitHub Actions default before
    # failing.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ inputs.cache-save }}

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/qt-runtime-linux

      - name: Install Clang and LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      # A rerun is the same run id, so the earlier attempt's exported product is a
      # cache hit. The import below revalidates its commit and run id either way.
      - id: coverage_cache
        if: github.run_attempt > 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: sonar-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/sonar-coverage

      # The Qt headers Sonar parses live under bazel-out/.../_virtual_includes.
      # A build served from the remote cache would not download them, and
      # without qobjectdefs.h Sonar misreads Qt's `emit` as a declaration.
      - name: Build and run tests with coverage
        if: steps.coverage_cache.outputs.cache-hit != 'true'
        run: scripts/coverage-local.sh
        env:
          EXTRA_BAZEL_ARGS: --remote_download_regex=.*/_virtual_includes/.*

      - id: coverage_export
        name: Export the completed coverage product
        if: steps.coverage_cache.outputs.cache-hit != 'true'
        run: |
          bazel run --config=coverage //tools/sonar:coverage_artifact -- export \
            --coverage-dir "$GITHUB_WORKSPACE/coverage" \
            --output "$RUNNER_TEMP/sonar-coverage" \
            --commit "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --producer-root "$GITHUB_WORKSPACE"

      - id: coverage_save
        if: steps.coverage_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: sonar-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/sonar-coverage

      - name: Prepare configured scanner inputs
        run: bazel run --config=sonar_inputs //:sonar_inputs

      - id: coverage_import
        name: Validate and localize coverage
        run: |
          bazel run --config=coverage //tools/sonar:coverage_artifact -- import \
            --artifact-dir "$RUNNER_TEMP/sonar-coverage" \
            --output "$GITHUB_WORKSPACE/coverage" \
            --commit "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" \
            --consumer-root "$GITHUB_WORKSPACE"

      - name: SonarCloud scan
        id: sonarcloud
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: SonarCloud scan (one retry)
        id: sonarcloud_retry
        if: steps.sonarcloud.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
