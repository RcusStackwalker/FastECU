name: SonarCloud

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to analyze
        required: true
        type: string
      cache-save:
        description: Save Bazel cache
        required: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: true
      BUILDBUDDY_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read

env:
  CC: clang
  CXX: clang++

jobs:
  # One job: a second runner's setup, cold Bazel start and artifact transfer cost
  # more than a separate scanner job's retry boundary was worth. A manual rerun
  # is a BuildBuddy cache hit for the coverage run, and a transient scanner
  # failure is retried once in place.
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-26.04
    # A hang here would otherwise burn the full 6h GitHub Actions default before
    # failing.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ inputs.cache-save }}

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/qt-runtime-linux

      - name: Install Clang and LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - id: coverage
        name: Build and run tests with coverage
        run: bazel coverage --config=coverage //...

      - id: coverage_report
        name: Convert coverage to Sonar generic format
        run: |
          bazel run --config=coverage //tools/sonar:coverage_report -- \
            --lcov "$(bazel info --config=coverage output_path)/_coverage/_coverage_report.dat" \
            --root "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/coverage"

      # The Qt headers Sonar parses live under bazel-out/.../_virtual_includes;
      # build:sonar_inputs (bazel/coverage.bazelrc) downloads them even when
      # the build is a cache hit.
      - name: Prepare configured scanner inputs
        run: bazel run --config=sonar_inputs //:sonar_inputs

      # Plugins rotate weekly with the scanner's own release cadence; a stale
      # restore-key still saves a re-download of most of them.
      - id: week
        name: Compute plugin cache week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Sonar plugin cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-plugins-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: sonar-plugins-${{ runner.os }}-

      - name: SonarCloud scan
        id: sonarcloud
        continue-on-error: true
        run: bazel run --config=coverage //tools/sonar:scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud scan (one retry)
        id: sonarcloud_retry
        if: steps.sonarcloud.outcome == 'failure'
        run: bazel run --config=coverage //tools/sonar:scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Save Sonar plugin cache
        if: inputs.cache-save && always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-plugins-${{ runner.os }}-${{ steps.week.outputs.week }}

      - name: Check SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
