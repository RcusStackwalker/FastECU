name: SonarCloud

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to analyze
        required: true
        type: string
      cache-save:
        description: Save Bazel cache
        required: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read

env:
  QT_MODULES: qtcharts qtserialport qtremoteobjects qtwebsockets
  # rules_qt supports Bazel builds on Qt 6.8.3.
  QT_VERSION: '6.8.3'

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-26.04
    # A hang here (see tests/force_asserts/BUILD.bazel for one known cause) would
    # otherwise burn the full 6h GitHub Actions default before failing.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Hold openjdk packages for this job
        run: |
          pkgs=$(dpkg-query -W -f='${Package}\n' 'openjdk-*' 'default-jdk*' 'default-jre*' 2>/dev/null || true)
          echo "openjdk packages found: ${pkgs:-<none>}"
          if [ -n "$pkgs" ]; then
            sudo apt-mark hold $pkgs
          fi

      - name: Start package-manager activity watcher
        run: |
          (
            while true; do
              echo "=== $(date -u +%FT%TZ) ==="
              pgrep -fal 'apt|dpkg|unattended' || true
              java_bin=$(command -v java || true)
              if [ -n "$java_bin" ]; then
                stat -c '%Y %n' "$(readlink -f "$java_bin")" 2>/dev/null || true
              fi
              sleep 15
            done
          ) > /tmp/pkg-watch.log 2>&1 &
          echo "watcher pid: $!"

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: fastecu-sonar-${{ runner.os }}
          cache-save: ${{ inputs.cache-save }}

      - name: Install Clang and LLVM tools (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Install SonarCloud build wrapper
        id: build-wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1

      - name: Compile under the build wrapper
        run: |
          "${{ steps.build-wrapper.outputs.build-wrapper-binary }}" --out-dir bw-output \
            bazel build --config=sonar //...

      - name: Run tests with coverage
        run: scripts/coverage-local.sh
        env:
          BAZEL_TEST_CONFIG: sonar

      - name: Dump package-manager activity for diagnosis
        if: always()
        run: |
          echo "--- watcher log ---"
          cat /tmp/pkg-watch.log || true
          echo "--- dpkg.log tail ---"
          sudo tail -n 300 /var/log/dpkg.log || true
          echo "--- apt history tail ---"
          sudo tail -n 300 /var/log/apt/history.log || true
          echo "--- unattended-upgrades log ---"
          sudo tail -n 300 /var/log/unattended-upgrades/unattended-upgrades.log || true
          echo "--- journalctl apt/dpkg/openjdk mentions ---"
          sudo journalctl --no-pager 2>/dev/null | grep -iE 'apt|dpkg|openjdk' | tail -n 300 || true

      - name: SonarCloud scan
        id: sonarcloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
