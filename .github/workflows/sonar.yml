name: SonarCloud

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to analyze
        required: true
        type: string
      cache-save:
        description: Save Bazel cache
        required: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read

env:
  QT_MODULES: qtcharts qtserialport qtremoteobjects qtwebsockets
  # rules_qt supports Bazel builds on Qt 6.8.3.
  QT_VERSION: '6.8.3'

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-26.04
    # A hang here (see tests/force_asserts/BUILD.bazel for one known cause) would
    # otherwise burn the full 6h GitHub Actions default before failing.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      # Bazel's server crashes mid-build with "Failed to exec spawn helper:
      # exit code: 1, error: 0 (none)" regardless of launch mechanism (FORK
      # vs posix_spawn) or spawn strategy (local vs sandboxed), and persists
      # even on the latest available Temurin 25.0.4.1+1 patch build -- ruling
      # out the specific JDK-8377907 pipe-fd race fix as the answer. Testing
      # whether this is scoped to the JDK 25 line at all: 21 is a multi-year
      # LTS already preinstalled on this image.
      - name: Select Java 21 LTS instead of the default JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Print resolved Java version
        run: java -version

      - name: Start resource activity watcher
        run: |
          echo "--- ulimit -a at job start ---"
          ulimit -a
          (
            while true; do
              echo "=== $(date -u +%FT%TZ) ==="
              free -m
              echo "processes: $(ps -e --no-headers | wc -l)"
              pgrep -fal 'apt|dpkg|unattended' | grep -vE 'adapter|apter' || true
              sleep 15
            done
          ) > /tmp/pkg-watch.log 2>&1 &
          echo "watcher pid: $!"

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: fastecu-sonar-${{ runner.os }}
          cache-save: ${{ inputs.cache-save }}

      - name: Install Clang and LLVM tools (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Install SonarCloud build wrapper
        id: build-wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1

      - name: Compile under the build wrapper
        run: |
          "${{ steps.build-wrapper.outputs.build-wrapper-binary }}" --out-dir bw-output \
            bazel build --config=sonar --spawn_strategy=local --strategy=Genrule=local //...

      - name: Run tests with coverage
        run: scripts/coverage-local.sh
        env:
          BAZEL_TEST_CONFIG: sonar

      - name: Dump resource and OOM diagnostics
        if: always()
        run: |
          echo "--- ulimit -a at job end ---"
          ulimit -a
          echo "--- watcher log (memory/process samples) ---"
          cat /tmp/pkg-watch.log || true
          echo "--- dmesg OOM/kill mentions ---"
          sudo dmesg --ctime 2>/dev/null | grep -iE 'oom|killed process|out of memory' || echo "none found"
          echo "--- journalctl -k OOM/kill mentions ---"
          sudo journalctl -k --no-pager 2>/dev/null | grep -iE 'oom|killed process|out of memory' || echo "none found"
          echo "--- journalctl apt/dpkg/openjdk mentions ---"
          sudo journalctl --no-pager 2>/dev/null | grep -iE 'apt|dpkg|openjdk' | tail -n 300 || true

      - name: SonarCloud scan
        id: sonarcloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
