name: SonarCloud

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to analyze
        required: true
        type: string
      cache-save:
        description: Save Bazel cache
        required: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: true
      BUILDBUDDY_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-26.04
    # A hang here would otherwise burn the full 6h GitHub Actions default before
    # failing.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ inputs.cache-save }}

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/qt-runtime-linux

      - name: Install Clang and LLVM tools (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      # The Qt headers Sonar parses live under bazel-out/.../_virtual_includes.
      # A build served from the remote cache would not download them, and
      # without qobjectdefs.h Sonar misreads Qt's `emit` as a declaration.
      - name: Build and run tests with coverage
        run: scripts/coverage-local.sh
        env:
          EXTRA_BAZEL_ARGS: --remote_download_regex=.*/_virtual_includes/.*

      - name: Generate compile_commands.json
        run: bazel run --config=coverage //bazel/compile_commands:refresh -- --config=coverage

      - name: Check Qt headers resolve through the compile database
        run: python3 scripts/sonar_compdb_check.py compile_commands.json

      - name: SonarCloud scan
        id: sonarcloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
