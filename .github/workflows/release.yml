name: Release

on:
  push:
    branches: [master]

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install prek
        run: pipx install prek

      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: prek run --all-files
        env:
          GITHUB_TOKEN: ${{ github.token }} # authenticates binstall/lychee GitHub requests
          SKIP: no-commit-to-branch # master is always checked out here

  release:
    needs: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.bump.outputs.next-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: bump
        uses: tomtom-international/commisery-action/bump@1910dece6192da25e159477b7de11ec1b722eefc # v8.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Tag only: the release is created as a draft below and published once
          # every asset is attached, because immutable releases reject later uploads.
          create-tag: true

      - name: Create draft release
        if: steps.bump.outputs.next-version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.next-version }}
        run: gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG"

  sonarcloud:
    name: SonarCloud
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/sonar.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      cache-save: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  build:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
      id-token: write # keyless Sigstore signing for the provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            package: windows_zip
          - os: macos-latest
            platform: macos
            package: macos_zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: ./.github/actions/llvm-bazel-prereqs

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: fastecu-build-${{ runner.os }}

      - name: Build and package (Bazel)
        env:
          # Git Bash would rewrite the leading "//" of the Bazel label to "/".
          MSYS_NO_PATHCONV: '1'
        run: |
          bazel build --config=release --define=FASTECU_VERSION=${{ needs.release.outputs.tag }} //packaging:${{ matrix.package }}
          # The release asset's name carries the tag; the Bazel output's does not.
          cp bazel-bin/packaging/${{ matrix.package }}.zip "FastECU-${{ needs.release.outputs.tag }}-${{ matrix.platform }}.zip"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: FastECU-${{ needs.release.outputs.tag }}-${{ matrix.platform }}.zip

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "FastECU-${{ needs.release.outputs.tag }}-${{ matrix.platform }}.zip"

  publish:
    name: publish
    needs: [release, build]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.release.outputs.tag }}" --draft=false
