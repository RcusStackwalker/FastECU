name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: read

env:
  QT_MODULES: qtcharts qtserialport qtremoteobjects qtwebsockets
  # rules_qt6 currently supports Bazel builds on 6.8.3. The macOS deploy
  # tooling must come from this same Qt version, or it version-mismatches
  # against the frameworks the Bazel binary links.
  QT_VERSION: '6.8.3'

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.next-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: bump
        uses: tomtom-international/commisery-action/bump@1910dece6192da25e159477b7de11ec1b722eefc # v8.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          create-release: true

  sonarcloud:
    name: SonarCloud
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/sonar.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      cache-save: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          modules: ${{ env.QT_MODULES }}
          add-tools-to-path: true

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: fastecu-build-${{ runner.os }}

      - name: Build and package Windows (Bazel)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/package-windows.ps1 -OutZip "FastECU-${{ needs.release.outputs.tag }}-windows.zip" -Version ${{ needs.release.outputs.tag }}

      - name: Build and package macOS (Bazel)
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh "FastECU-${{ needs.release.outputs.tag }}-macos.zip" ${{ needs.release.outputs.tag }}

      - name: Upload release asset (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: FastECU-${{ needs.release.outputs.tag }}-windows.zip

      - name: Upload release asset (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: FastECU-${{ needs.release.outputs.tag }}-macos.zip
