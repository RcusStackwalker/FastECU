name: Release

on:
  push:
    branches: [master]

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install prek
        run: pipx install prek

      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: prek run --all-files
        env:
          GITHUB_TOKEN: ${{ github.token }} # authenticates binstall/lychee GitHub requests
          SKIP: no-commit-to-branch # master is always checked out here

  release:
    needs: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.bump.outputs.next-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: bump
        uses: tomtom-international/commisery-action/bump@1910dece6192da25e159477b7de11ec1b722eefc # v8.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          create-release: true

  sonarcloud:
    name: SonarCloud
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/sonar.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      cache-save: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            package: windows_zip
          - os: macos-latest
            platform: macos
            package: macos_zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: fastecu-build-${{ runner.os }}

      - name: Build and package (Bazel)
        shell: bash
        env:
          # Git Bash would rewrite the leading "//" of the Bazel label to "/".
          MSYS_NO_PATHCONV: '1'
        run: |
          bazel build --config=release --define=FASTECU_VERSION=${{ needs.release.outputs.tag }} //packaging:${{ matrix.package }}
          # The release asset's name carries the tag; the Bazel output's does not.
          cp bazel-bin/packaging/${{ matrix.package }}.zip "FastECU-${{ needs.release.outputs.tag }}-${{ matrix.platform }}.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: FastECU-${{ needs.release.outputs.tag }}-${{ matrix.platform }}.zip
