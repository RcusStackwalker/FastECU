name: SonarCloud spike (compile database)

# Spike: can SonarCloud take its C++ compile database from a cached Bazel build
# instead of the build wrapper? Runs both variants on one commit into a separate
# SonarCloud project so master's history is untouched. Manual only.
# Findings: docs/superpowers/spikes/2026-10-19-sonar-compile-database.md

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SPIKE_PROJECT_KEY: rcusstackwalker_fastecu-sonar-spike

jobs:
  wrapper:
    name: Baseline (build wrapper)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/qt-runtime-linux

      - name: Install Clang and LLVM tools (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Install SonarCloud build wrapper
        id: build-wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1

      - name: Compile under the build wrapper
        run: |
          "${{ steps.build-wrapper.outputs.build-wrapper-binary }}" --out-dir bw-output \
            bazel build --config=sonar --spawn_strategy=local --strategy=Genrule=local //...

      - name: Shut down the build-wrapper-instrumented server
        run: bazel shutdown

      - name: Run tests with coverage
        run: scripts/coverage-local.sh
        env:
          BAZEL_TEST_CONFIG: sonar

      - name: Wrapper database summary
        run: python3 scripts/sonar_spike_compdb_check.py bw-output/compile_commands.json || true

      - name: SonarCloud scan (branch "wrapper")
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SPIKE_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SPIKE_PROJECT_KEY }}
            -Dsonar.branchName=wrapper

  compdb:
    name: Candidate (Hedron compile database, cached build)
    # After the baseline so the two first analyses do not race to create the
    # project's main branch.
    needs: wrapper
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/qt-runtime-linux

      - name: Install Clang and LLVM tools (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      # Q11(a): keep the generated Qt header trees on disk even when the build is
      # served from the remote cache, so the paths in the database resolve at
      # scan time. Tests need their binaries locally either way.
      - name: Build and run tests with coverage (remote cache)
        run: scripts/coverage-local.sh
        env:
          BAZEL_TEST_CONFIG: coverage
          EXTRA_BAZEL_ARGS: --remote_download_regex=.*/_virtual_includes/.*

      - name: Generate compile_commands.json (Hedron, sonar config)
        run: bazel run --config=coverage //bazel/compile_commands:refresh -- --config=coverage

      - name: Compile database summary
        run: python3 scripts/sonar_spike_compdb_check.py compile_commands.json --rewrite-compiler || true

      - name: SonarCloud scan (branch "compdb")
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SPIKE_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SPIKE_PROJECT_KEY }}
            -Dsonar.branchName=compdb
            -Dsonar.cfamily.compile-commands=compile_commands.json

  compare:
    name: Compare analyses
    needs: [wrapper, compdb]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Query SonarCloud for both branches
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SPIKE_TOKEN }}
        run: |
          api() { curl -fsS -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/$1"; }
          {
            echo "| branch | total issues | cpp:S1117 | cpp:S824 | ncloc |"
            echo "|---|---|---|---|---|"
            for b in wrapper compdb; do
              q="componentKeys=${SPIKE_PROJECT_KEY}&branch=${b}&ps=1"
              total=$(api "issues/search?${q}&resolved=false" | jq .total)
              s1117=$(api "issues/search?${q}&resolved=false&rules=cpp:S1117" | jq .total)
              s824=$(api "issues/search?${q}&resolved=false&rules=cpp:S824" | jq .total)
              ncloc=$(api "measures/component?component=${SPIKE_PROJECT_KEY}&branch=${b}&metricKeys=ncloc" | jq -r '.component.measures[0].value // "n/a"')
              echo "| ${b} | ${total} | ${s1117} | ${s824} | ${ncloc} |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
