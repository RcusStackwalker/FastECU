name: mutation

# Weekly Mull mutation testing of all portable code (ADR 0022); a manual run
# can narrow it to a scope. Advisory: it reports surviving mutants and never
# gates anything. The PR workflow's `mutation` job runs the same script on a
# PR's changed lines.

on:
  schedule:
    - cron: '41 4 * * 0' # Sundays 04:41 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          Bazel target pattern whose tests run, e.g. //src/algorithms/protocol/...
          (empty: all portable code). Run on a branch to measure the mutants its
          new tests kill.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Mutation testing (portable code)
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/mull-linux

      - name: Run Mull over the portable tests in scope
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          python3 scripts/mutation_test.py ${SCOPE:+--scope "$SCOPE"} \
            --report-dir "${RUNNER_TEMP}/mutation" --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report
          path: ${{ runner.temp }}/mutation
          if-no-files-found: warn
          retention-days: 30
