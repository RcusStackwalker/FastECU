name: mutation

# Weekly Mull mutation testing of all portable code (ADR 0022); a manual run
# can narrow it to a scope. Advisory: it reports surviving mutants and never
# gates anything. Four jobs balance duration estimates, splitting expensive
# binaries with GoogleTest sharding; a merge job combines their reports. The PR
# workflow's `mutation` job runs the same script, unsharded, on a PR's changed
# lines.

on:
  schedule:
    - cron: '41 4 * * 0' # Sundays 04:41 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          Bazel target pattern whose tests run, e.g. //src/algorithms/protocol/...
          (empty: all portable code). Run on a branch to measure the mutants its
          new tests kill.
        required: false
        default: ''
        type: string
      baseline_run:
        description: 'Optional run ID to compare against (use identical production sources and scope)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shard:
    name: Mutation testing (shard ${{ matrix.shard }})
    runs-on: ubuntu-26.04
    # Keep the diagnostic ceiling above the 20-minute performance target so
    # a regression still publishes complete measurements.
    timeout-minutes: 120
    strategy:
      # A failed shard must not cancel the others: the merge job reports
      # whatever finished and names the shards that did not.
      fail-fast: false
      matrix:
        # The script's --shard I/4 and the merge job's --shards 4 follow this.
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: ./.github/actions/mull-linux

      - name: Run Mull over this shard's portable tests
        env:
          SCOPE: ${{ inputs.scope }}
          SHARD: ${{ matrix.shard }}
        run: |
          python3 scripts/mutation_test.py --shard "${SHARD}/4" \
            --schedule bazel/mutation-schedule.json ${SCOPE:+--scope "$SCOPE"} \
            --report-dir "${RUNNER_TEMP}/mutation"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutation
          if-no-files-found: warn
          retention-days: 30

  merge:
    name: Mutation testing (merged report)
    needs: shard
    # Runs after failed or cancelled shards too; it fails the run when any
    # shard did not finish.
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-report-shard-*
          path: ${{ runner.temp }}/mutation

      - name: Download comparison baseline
        if: inputs.baseline_run != '' && inputs.baseline_run != null
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-report
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mutation-baseline

      - name: Merge the shards' reports
        env:
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          args=()
          if [ -n "$BASELINE_RUN" ]; then
            args+=(--baseline-reports "${RUNNER_TEMP}/mutation-baseline")
          fi
          python3 scripts/mutation_test.py --merge-reports "${RUNNER_TEMP}/mutation" --shards 4 \
            --summary "$GITHUB_STEP_SUMMARY" "${args[@]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report
          path: ${{ runner.temp }}/mutation
          if-no-files-found: warn
          retention-days: 30
