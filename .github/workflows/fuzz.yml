name: fuzz

# Coverage-guided fuzzing of every `fuzz`-tagged harness (ADR 0021). The PR
# gate only replays committed seeds; this explores beyond them. A crash fails
# the harness's job and uploads its reproducer: minimize it, commit it as a
# seed with the fix, and the PR gate replays it from then on.

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      budget:
        description: Fuzzing time per harness binary, shared by its properties (for example 10m or 2h)
        required: true
        default: 10m

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harnesses:
    name: Find fuzz harnesses
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.query.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - name: Query fuzz-tagged tests
        id: query
        run: |
          targets="$(bazel query 'attr(tags, "\bfuzz\b", tests(//src/...))' | jq -R . | jq -cs .)"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          echo "${targets}"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: harnesses
    runs-on: ubuntu-26.04
    # Generous: a manual run may ask for hours. The budget, not this, bounds it.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.harnesses.outputs.targets) }}
    env:
      BUDGET: ${{ inputs.budget || '10m' }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      # The PR workflow owns the LLVM pin; read it rather than repeat it.
      - name: Read the LLVM pin
        id: llvm
        run: |
          version="$(sed -n "s/^  CLANG_TIDY_LLVM_VERSION: '\(.*\)'$/\1/p" .github/workflows/pr.yml)"
          sha256="$(sed -n "s/^  CLANG_TIDY_LLVM_SHA256_LINUX: '\(.*\)'$/\1/p" .github/workflows/pr.yml)"
          if [ -z "${version}" ] || [ -z "${sha256}" ]; then
            echo "::error::cannot read the CLANG_TIDY_LLVM_* pin from pr.yml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/llvm-linux
        with:
          version: ${{ steps.llvm.outputs.version }}
          sha256: ${{ steps.llvm.outputs.sha256 }}

      - name: Build the harness for fuzzing
        run: bazel build --config=fuzztest "${TARGET}"

      # From the runfiles root, so the harness finds its seeds by their
      # workspace-relative paths, as under `bazel test`.
      - name: Fuzz
        run: |
          package="${TARGET#//}"; package="${package%%:*}"
          binary="${GITHUB_WORKSPACE}/bazel-bin/${package}/${TARGET##*:}"
          mkdir -p "${RUNNER_TEMP}/reproducers"
          cd "${binary}.runfiles/_main"
          FUZZTEST_REPRODUCERS_OUT_DIR="${RUNNER_TEMP}/reproducers" \
            "${binary}" --fuzz_for="${BUDGET}" --time_budget_type=total

      - name: Name the reproducer artifact
        if: failure()
        id: artifact
        run: echo "name=fuzz-reproducers-$(printf '%s' "${TARGET}" | tr -c 'A-Za-z0-9_-' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/reproducers
          if-no-files-found: warn
          retention-days: 30
